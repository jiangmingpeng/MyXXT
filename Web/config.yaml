# Frontend Configuration

api:
  base_url: "/api"
  # 普通接口（列表 / 查询 / 检查）的超时。这些接口只查本地库，10s 足够。
  timeout: 10000
  # 签到类接口（/sign/execute、/sign/photo）的超时。
  # 单次签到要串行经过「预签到 → 验证码识别 → 提交」多个学习通请求，
  # 慢代理下正常值就有 6~15s，用 10s 会在后端还在正常执行时就被前端掐断。
  sign_timeout: 25000

sign:
  # 批量签到的并发上限（建议与后端 antiban.max_concurrency 保持一致）。
  # 设成 1 表示严格串行，最慢但最安全。
  max_concurrency: 2
  # 每个账号发起请求前的随机等待区间（毫秒），用于打散请求时间。
  stagger_min_ms: 150
  stagger_max_ms: 900
  # 圆心校准进度的本地保留时长（分钟）。
  # 手机上拍照时页面可能被系统回收，重载后靠它继续上次的探测（每张刷新码只能用一次，
  # 丢一次进度就等于要多拍一张新码）。超过该时长视为上一场签到，直接丢弃。
  calibration_session_ttl_minutes: 120

